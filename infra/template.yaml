AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Agentic accessibility remediation pipeline

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-5-20250929-v1:0
  BedrockRegion:
    Type: String
    Default: us-east-1

Globals:
  Function:
    Timeout: 300
    MemorySize: 3008
    Environment:
      Variables:
        ARTIFACT_BUCKET: !Ref ArtifactBucket
        RUN_TABLE: !Ref RunTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        AXE_SCRIPT_PATH: /var/task/vendor/axe.min.js

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Patched copies of third-party pages are NEVER public. They are served
      # to the dashboard through short-lived presigned URLs only.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  RunTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: agent
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["agent.handler.lambda_handler"]
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunTable
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:Converse
            Resource: "*"

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: api
    Properties:
      PackageType: Image
      MemorySize: 1024
      Timeout: 30
      ImageConfig:
        Command: ["api.handler.lambda_handler"]
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RunStateMachine
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt RunStateMachine.Name
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  RunStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref AgentFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref RunTable
      Definition:
        Comment: Fan out over seed URLs, run the agent on each page
        StartAt: ProcessPages
        States:
          ProcessPages:
            Type: Map
            ItemsPath: $.urls
            MaxConcurrency: 2
            Parameters:
              runId.$: $.runId
              url.$: $$.Map.Item.Value
            Iterator:
              StartAt: RunAgent
              States:
                RunAgent:
                  Type: Task
                  Resource: !GetAtt AgentFunction.Arn
                  Retry:
                    - ErrorEquals: [States.TaskFailed, Lambda.ServiceException]
                      IntervalSeconds: 5
                      MaxAttempts: 2
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: RecordFailure
                  End: true
                RecordFailure:
                  Type: Pass
                  End: true
            ResultPath: $.pageResults
            End: true

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  RunTableName:
    Value: !Ref RunTable
  StateMachineArn:
    Value: !Ref RunStateMachine
