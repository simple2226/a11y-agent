# Amplify build spec -- Next.js SSR app in a subdirectory.
#
# appRoot tells Amplify the app lives in web/, so every path below is relative
# to web/ (hence .amplify-hosting, not web/.amplify-hosting). It needs a
# matching environment variable or Amplify ignores it:
#
#   AMPLIFY_MONOREPO_APP_ROOT = web
#
# We build the deploy bundle ourselves rather than relying on Amplify's
# built-in Next.js adapter. That adapter writes deploy-manifest.json, but it
# only runs when Amplify's own framework detection fires, which it does not do
# reliably for an app in a subdirectory -- the build then succeeds and the
# deploy fails with "Failed to find the deploy-manifest.json file". The npm
# build script chains scripts/build-amplify-bundle.mjs, which emits
# .amplify-hosting/ with the manifest, the compute bundle and the static root.
#
# The app platform must be WEB_COMPUTE: /api/page-html proxies artifacts at
# request time, so a static deploy cannot serve this app.
#
# NEXT_PUBLIC_* is inlined at BUILD time, so changing it needs a redeploy.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm ci || npm install
        build:
          commands:
            - |
              if [ -z "$NEXT_PUBLIC_API_URL" ]; then
                echo "NEXT_PUBLIC_API_URL is not set. The dashboard would build in"
                echo "local-file mode and show 'No run to show yet' forever."
                echo "Set it in Amplify console -> Hosting -> Environment variables."
                exit 1
              fi
            # next build, then scripts/build-amplify-bundle.mjs
            - npm run build
            - echo "--- deploy bundle ---"
            - cat .amplify-hosting/deploy-manifest.json
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*