# Amplify build spec for the dashboard.
#
# The Next.js app lives in web/, not at the repo root, so appRoot points there.
# In the Amplify console set the app's root directory to "web" as well, and add
# NEXT_PUBLIC_API_URL as an environment variable pointing at the deployed API:
#   NEXT_PUBLIC_API_URL = https://<id>.execute-api.us-east-1.amazonaws.com
#
# NEXT_PUBLIC_* values are inlined at BUILD time, not read at runtime. Changing
# the variable therefore requires a redeploy, not just a restart.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci || npm install
        build:
          commands:
            - |
              if [ -z "$NEXT_PUBLIC_API_URL" ]; then
                echo "NEXT_PUBLIC_API_URL is not set -- the dashboard would build"
                echo "in local-file mode and show 'No run to show yet' forever."
                echo "Set it in Amplify console -> Hosting -> Environment variables."
                exit 1
              fi
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*