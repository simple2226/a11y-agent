# Amplify build spec.
#
# The Next.js app lives in web/, not at the repo root.
#
# Note there is no `cd`. Amplify runs a phase's commands in one shell and the
# working directory CARRIES OVER between phases, so a `cd web` in preBuild
# leaves the build phase already inside web/ and a second `cd web` fails with
# "No such file or directory". `npm --prefix` never changes directory, so it
# behaves the same however Amplify chooses to sequence the phases.
#
# Because cwd stays at the repo root, artifacts.baseDirectory is web/.next.
#
# Still required in the console:
#   Environment variables: NEXT_PUBLIC_API_URL = https://<id>.execute-api.<region>.amazonaws.com
#   Platform must be WEB_COMPUTE (Next.js SSR) -- /api/page-html proxies
#   artifacts at request time, so a static deploy cannot serve this app.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - pwd
        # npm ci needs a committed package-lock.json; fall back if absent.
        - npm --prefix web ci || npm --prefix web install
    build:
      commands:
        - |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "NEXT_PUBLIC_API_URL is not set. The dashboard would build in"
            echo "local-file mode and show 'No run to show yet' forever."
            echo "Set it in Amplify console -> Hosting -> Environment variables."
            exit 1
          fi
        - npm --prefix web run build
        - echo "--- build output ---"
        - ls -la web/.next | head -15
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - web/.next/cache/**/*