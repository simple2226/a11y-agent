# Amplify build spec -- Next.js SSR app in a subdirectory.
#
# The `applications:` / `appRoot:` (monorepo) form is REQUIRED here, not a
# style choice. Amplify's Next.js adapter is what writes deploy-manifest.json,
# and it only runs when Amplify knows where the Next.js app lives. Build the
# app with `cd` or `npm --prefix` from a plain spec and the build succeeds but
# the deploy fails with:
#
#   CustomerError: Failed to find the deploy-manifest.json file in the build output
#
# Because appRoot is web, every path below is relative to web/ -- so
# baseDirectory is .next, NOT web/.next.
#
# This form also needs a matching environment variable, or Amplify ignores it:
#   AMPLIFY_MONOREPO_APP_ROOT = web
#
# And the app platform must be WEB_COMPUTE. /api/page-html proxies artifacts at
# request time, so a static deploy cannot serve this app.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - pwd
            # npm ci needs the committed package-lock.json; fall back if absent.
            - npm ci || npm install
        build:
          commands:
            - |
              if [ -z "$NEXT_PUBLIC_API_URL" ]; then
                echo "NEXT_PUBLIC_API_URL is not set. The dashboard would build in"
                echo "local-file mode and show 'No run to show yet' forever."
                echo "Set it in Amplify console -> Hosting -> Environment variables."
                exit 1
              fi
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*